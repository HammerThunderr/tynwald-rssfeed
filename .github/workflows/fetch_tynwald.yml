# ─────────────────────────────────────────────────────────────
# Tynwald RSS scraper workflow
#
# Place at: .github/workflows/tynwald.yml in your tynwald-rssfeed repo
#
# Reduced from frequent runs to twice daily — Tynwald data
# changes slowly and rate-limits aggressively.
# ─────────────────────────────────────────────────────────────

name: Scrape Tynwald RSS

on:
  schedule:
    # Run at 8am and 8pm UTC daily — avoids peak load times
    - cron: '0 8,20 * * *'
  workflow_dispatch:    # manual trigger

concurrency:
  group: tynwald
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run scraper
        run: python scripts/scrape_tynwald.py
        timeout-minutes: 15

      - name: Commit and push (with retry)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "chore: update Tynwald data $(date -u '+%Y-%m-%d %H:%M UTC')"

          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            echo "Push attempt $i failed, retrying..."
            sleep 3
          done
